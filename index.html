<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculatrices</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>Calculatrices</h1>
  <nav class="menu">
    <button class="menu-item actif" data-cible="simple">Calculatrice simple</button>
    <button class="menu-item" data-cible="scientifique">Calculatrice scientifique</button>
    <button class="menu-item" data-cible="graphique">Calculatrice graphique</button>
  </nav>
</header>

<main>

  <section id="panneau-simple" class="panneau actif panneau-etroit">
    <div>
      <label for="nombre1">Premier nombre :</label>
      <input type="number" id="nombre1" placeholder="Entrez le premier nombre">
    </div>

    <div>
      <label for="nombre2">Deuxième nombre :</label>
      <input type="number" id="nombre2" placeholder="Entrez le deuxième nombre">
    </div>

    <div>
      <label for="operation">Opération :</label>
      <select id="operation">
        <option value="addition">Addition (+)</option>
        <option value="soustraction">Soustraction (-)</option>
        <option value="multiplication">Multiplication (×)</option>
      </select>
    </div>

    <button id="calculerBtn">Résultat</button>

    <div id="resultat"></div>
  </section>

  <section id="panneau-scientifique" class="panneau panneau-etroit">
    <input type="text" id="sci-affichage" class="sci-affichage" placeholder="0">

    <div class="sci-grille">
      <button data-action="mode" id="sci-mode">Rad</button>
      <button data-action="ac">AC</button>
      <button data-action="del">DEL</button>
      <button data-valeur="(">(</button>
      <button data-valeur=")">)</button>

      <button data-valeur="sin(">sin</button>
      <button data-valeur="cos(">cos</button>
      <button data-valeur="tan(">tan</button>
      <button data-valeur="^">^</button>
      <button data-valeur="sqrt(">√</button>

      <button data-valeur="7">7</button>
      <button data-valeur="8">8</button>
      <button data-valeur="9">9</button>
      <button data-valeur="/">÷</button>
      <button data-valeur="log(">log</button>

      <button data-valeur="4">4</button>
      <button data-valeur="5">5</button>
      <button data-valeur="6">6</button>
      <button data-valeur="*">×</button>
      <button data-valeur="ln(">ln</button>

      <button data-valeur="1">1</button>
      <button data-valeur="2">2</button>
      <button data-valeur="3">3</button>
      <button data-valeur="-">−</button>
      <button data-valeur="pi">π</button>

      <button data-valeur="0">0</button>
      <button data-valeur=".">.</button>
      <button data-action="egal" class="sci-egal">=</button>
      <button data-valeur="+">+</button>
      <button data-valeur="e">e</button>
    </div>

    <div id="sci-erreur" class="erreur"></div>
  </section>

  <section id="panneau-graphique" class="panneau panneau-large">
    <div class="graph-barre">
      <label for="fonction">f(x) =</label>
      <input type="text" id="fonction" placeholder="ex: sin(x)*x">
      <button id="tracerBtn">Tracer</button>
    </div>

    <div class="graph-controles">
      <button id="zoomMoins">−</button>
      <button id="zoomPlus">+</button>
      <button id="reinitialiserVue">Réinitialiser la vue</button>
    </div>

    <canvas id="graphCanvas" width="600" height="400"></canvas>

    <div id="grapheErreur" class="erreur"></div>
  </section>

</main>

<script src="app.js" defer></script>

</body>
</html>
